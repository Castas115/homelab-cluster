apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrutiny
  namespace: scrutiny
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: scrutiny-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["scrutiny.lan.home"]
  rules:
    - host: scrutiny.lan.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scrutiny
                port:
                  number: 8080
