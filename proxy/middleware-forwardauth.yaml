# addAuthCookiesToResponse cookie name is derived from the forwardauth
# provider's pk (authentik_proxy_<hash>) — if the authentik DB is ever
# wiped/rebootstrapped, re-check it (curl the /auth/traefik endpoint
# with a Host header for any gated app and look at Set-Cookie) and
# update all three Middlewares below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: media
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    addAuthCookiesToResponse:
      - authentik_proxy_8fed18ce
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
