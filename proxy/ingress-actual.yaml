apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: actual
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["actual.lan.home"]
  rules:
    - host: actual.lan.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 5006
