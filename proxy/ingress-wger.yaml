apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wger
  namespace: wger
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["wger.lan.home"]
  rules:
    - host: wger.lan.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wger
                port:
                  number: 80
