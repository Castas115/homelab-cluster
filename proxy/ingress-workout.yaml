apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workout
  namespace: wger
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["workout.lan.home"]
  rules:
    - host: workout.lan.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workout-routine
                port:
                  number: 80
