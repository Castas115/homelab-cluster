apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lyftr
  namespace: lyftr
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["lyftr.lan.home"]
  rules:
    - host: lyftr.lan.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lyftr-frontend
                port:
                  number: 80
