apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  namespace: backup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      containers:
        - name: rest-server
          image: restic/rest-server:0.14.0
          args:
            - --path=/data
            - --listen=:8000
            - --htpasswd-file=/auth/.htpasswd
            - --private-repos
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: repo
              mountPath: /data
            - name: auth
              mountPath: /auth
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: restic-repo
        - name: auth
          secret:
            secretName: rest-server-htpasswd
